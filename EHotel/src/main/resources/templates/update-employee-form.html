<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier un employé')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Modifier un employé</h1>
    <form th:action="@{/manager/employee/update/{sin}(sin=*{sinEmployee})}" th:object="${employee}" method="post" novalidate>
        <input type="hidden" th:field="*{sinEmployee}">
        <p>NAS : <strong th:text="*{sinEmployee}"></strong></p>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: input('firstname', 'Prénom', 'text')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: input('lastname', 'Nom', 'text')}"></div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="role">Rôle</label>
                <select class="form-select" th:field="*{role}">
                    <option th:each="r : ${ {'Manager','Receptionist','Housekeeper','Maintenance','Security','Cook','Waiter','Concierge','Valet','Driver','Spa therapist','Fitness instructor','Lifeguard','Accountant','Human resources','Marketing','Customer service'} }"
                            th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="idHotel">Hôtel</label>
                <select class="form-select" th:field="*{idHotel}" th:errorclass="is-invalid">
                    <option th:each="hotel : ${hotels}" th:value="${hotel.idHotel}" th:text="${hotel.name}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('idHotel')}" th:errors="*{idHotel}"></div>
            </div>
            <div class="col-md-4" th:insert="~{fragments/layout :: input('streetNumber', 'Numéro de rue', 'number')}"></div>
            <div class="col-md-8" th:insert="~{fragments/layout :: input('streetName', 'Nom de rue', 'text')}"></div>
            <div class="col-md-5" th:insert="~{fragments/layout :: input('city', 'Ville', 'text')}"></div>
            <div class="col-md-3" th:insert="~{fragments/layout :: input('postalCode', 'Code postal', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: country}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/manager/employees}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
