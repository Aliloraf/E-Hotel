<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hôtels')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h2">Hôtels</h1>
        <a th:href="@{/hotel/add}" class="btn btn-primary">Ajouter un hôtel</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th scope="col">Nom</th>
                    <th scope="col">Chaîne</th>
                    <th scope="col">Étoiles</th>
                    <th scope="col">Ville</th>
                    <th scope="col">Chambres</th>
                    <th scope="col">Gérant</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="hotel : ${hotels}">
                    <td th:text="${hotel.name}"></td>
                    <td th:text="${hotel.hotelChain.name}"></td>
                    <td th:text="${hotel.startNumber}"></td>
                    <td th:text="${hotel.city}"></td>
                    <td><a th:href="@{/room/list(hotelId=${hotel.idHotel})}" th:text="${hotel.roomsNumber}"></a></td>
                    <td th:text="${hotel.manager != null ? hotel.manager.firstname + ' ' + hotel.manager.lastname : '-'}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/hotel/update/{id}(id=${hotel.idHotel})}" class="btn btn-primary btn-sm">Modifier</a>
                        <form th:action="@{/hotel/delete/{id}(id=${hotel.idHotel})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer cet hôtel ainsi que ses chambres, réservations et locations ?');">
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
