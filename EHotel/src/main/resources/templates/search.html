<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rechercher une chambre')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h2">Rechercher une chambre</h1>
    <p class="text-muted">Seules les dates sont obligatoires ; les autres critères sont facultatifs.</p>

    <form th:action="@{/room/search}" th:object="${criteria}" method="post" class="row g-3" novalidate>
        <div class="col-12"><div th:replace="~{fragments/layout :: globalErrors}"></div></div>
        <div class="col-md-3" th:insert="~{fragments/layout :: input('startDate', 'Date d\'arrivée', 'date')}"></div>
        <div class="col-md-3" th:insert="~{fragments/layout :: input('endDate', 'Date de départ', 'date')}"></div>
        <div class="col-12 text-danger small" th:if="${#fields.hasErrors('endDateAfterStartDate')}" th:errors="*{endDateAfterStartDate}"></div>
        <div class="col-md-3">
            <label class="form-label" for="roomCapacity">Capacité de la chambre</label>
            <select class="form-select" th:field="*{roomCapacity}">
                <option value="">Toutes</option>
                <option th:each="c : ${ {'Simple','Double','Triple','Quadruple','Suite','Penthouse'} }" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>
        <div class="col-md-3" th:insert="~{fragments/layout :: input('maxPrice', 'Prix maximum par nuit ($)', 'number')}"></div>
        <div class="col-md-3">
            <label class="form-label" for="hotelChainId">Chaîne hôtelière</label>
            <select class="form-select" th:field="*{hotelChainId}">
                <option value="">Toutes</option>
                <option th:each="chain : ${hotelChains}" th:value="${chain.id}" th:text="${chain.name}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="city">Ville</label>
            <select class="form-select" th:field="*{city}">
                <option value="">Toutes</option>
                <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="startNumber">Catégorie minimale (étoiles)</label>
            <select class="form-select" th:field="*{startNumber}">
                <option value="">Toutes</option>
                <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n}"></option>
            </select>
        </div>
        <div class="col-md-3" th:insert="~{fragments/layout :: input('roomsNumber', 'Nombre minimal de chambres de l\'hôtel', 'number')}"></div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Rechercher</button>
        </div>
    </form>

    <div class="mt-5" th:if="${rooms != null}">
        <h2 class="h4">Chambres disponibles <span class="badge bg-secondary" th:text="${#lists.size(rooms)}"></span></h2>
        <p th:if="${#lists.isEmpty(rooms)}" class="text-muted">Aucune chambre ne correspond à ces critères.</p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(rooms)}">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Chaîne hôtelière</th>
                        <th>Hôtel</th>
                        <th>Étoiles</th>
                        <th>Ville</th>
                        <th>N° chambre</th>
                        <th>Capacité</th>
                        <th>Vue</th>
                        <th>Prix / nuit</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="room : ${rooms}">
                        <td th:text="${room.hotel.hotelChain.name}"></td>
                        <td th:text="${room.hotel.name}"></td>
                        <td th:text="${room.hotel.startNumber}"></td>
                        <td th:text="${room.hotel.city}"></td>
                        <td th:text="${room.roomNumber}"></td>
                        <td th:text="${room.capacity}"></td>
                        <td th:text="${room.view}"></td>
                        <td th:text="${#numbers.formatDecimal(room.price, 1, 2)} + ' $'"></td>
                        <td>
                            <a th:href="@{/room/book/{id}(id=${room.idRoom}, startDate=${criteria.startDate}, endDate=${criteria.endDate})}"
                               class="btn btn-primary btn-sm">Réserver</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
