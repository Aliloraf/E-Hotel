<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Enregistrer un paiement')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Enregistrer un paiement</h1>
    <p class="text-muted">
        Location n° <span th:text="${rental.idRental}"></span> :
        <span th:text="${rental.customer.firstname} + ' ' + ${rental.customer.lastname}"></span>,
        <span th:text="${rental.room.hotel.name}"></span>, chambre <span th:text="${rental.room.roomNumber}"></span>
        (<span th:text="${rental.startDate}"></span> → <span th:text="${rental.endDate}"></span>)
    </p>
    <form th:action="@{/payment/add/{id}(id=${rental.idRental})}" th:object="${payment}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: input('amount', 'Montant ($)', 'number')}"></div>
        <div th:replace="~{fragments/layout :: input('paymentDate', 'Date', 'date')}"></div>
        <div class="mb-3">
            <label for="paymentMethod" class="form-label">Méthode de paiement</label>
            <select class="form-select" th:field="*{paymentMethod}">
                <option value="Credit card">Carte de crédit</option>
                <option value="Debit card">Carte de débit</option>
                <option value="Cash">Comptant</option>
                <option value="Check">Chèque</option>
                <option value="Bank transfer">Virement bancaire</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="paymentStatus" class="form-label">Statut du paiement</label>
            <select class="form-select" th:field="*{paymentStatus}">
                <option value="Paid">Payé</option>
                <option value="Pending">En attente</option>
                <option value="Refunded">Remboursé</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/booking/rentals}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
