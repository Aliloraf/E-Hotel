<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h2">Liste des clients</h1>
        <a th:href="@{/employee/customer/add}" class="btn btn-primary">Ajouter un client</a>
    </div>
    <p th:if="${#lists.isEmpty(customers)}" class="text-muted mt-3">Aucun client enregistré.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(customers)}">
        <table class="table table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th scope="col">NAS</th>
                    <th scope="col">Prénom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Adresse</th>
                    <th scope="col">Ville</th>
                    <th scope="col">Code postal</th>
                    <th scope="col">Pays</th>
                    <th scope="col">Enregistré le</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.sinCustomer}"></td>
                    <td th:text="${customer.firstname}"></td>
                    <td th:text="${customer.lastname}"></td>
                    <td th:text="${customer.streetNumber} + ' ' + ${customer.streetName}"></td>
                    <td th:text="${customer.city}"></td>
                    <td th:text="${customer.postalCode}"></td>
                    <td th:text="${customer.country}"></td>
                    <td th:text="${customer.checkInDate}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/employee/customer/update/{sin}(sin=${customer.sinCustomer})}" class="btn btn-primary btn-sm">Modifier</a>
                        <form th:action="@{/employee/customer/delete/{sin}(sin=${customer.sinCustomer})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer ce client ?');">
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
