<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier une chambre')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Modifier une chambre</h1>
    <form th:action="@{/room/update/{id}(id=*{idRoom})}" th:object="${room}" method="post" novalidate>
        <input type="hidden" th:field="*{idHotel}">
        <p>Hôtel : <strong th:text="${hotelName}"></strong></p>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: input('roomNumber', 'Numéro de chambre', 'number')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: input('price', 'Prix par nuit ($)', 'number')}"></div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="capacity">Capacité</label>
                <select class="form-select" th:field="*{capacity}">
                    <option th:each="c : ${ {'Simple','Double','Triple','Quadruple','Suite','Penthouse'} }" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="view">Vue</label>
                <select class="form-select" th:field="*{view}">
                    <option th:each="v : ${ {'Sea','Mountain','City','Garden','Pool','Lake','Forest','River','Park','Courtyard','Street','Other'} }" th:value="${v}" th:text="${v}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="availability">Disponibilité</label>
                <select class="form-select" th:field="*{availability}">
                    <option value="true">Disponible</option>
                    <option value="false">Non disponible</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="extensible">Extensible (lit d'appoint)</label>
                <select class="form-select" th:field="*{extensible}">
                    <option value="true">Oui</option>
                    <option value="false">Non</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/room/list(hotelId=*{idHotel})}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
