<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Réservation')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Formulaire de réservation</h1>
    <div class="card mb-4">
        <div class="card-body">
            <strong th:text="${room.hotel.name}"></strong>, <span th:text="${room.hotel.city}"></span><br>
            Chambre <span th:text="${room.roomNumber}"></span> · <span th:text="${room.capacity}"></span>
            · vue <span th:text="${room.view}"></span>
            · <span th:text="${#numbers.formatDecimal(room.price, 1, 2)} + ' $ / nuit'"></span>
        </div>
    </div>

    <form th:action="@{/room/booking}" th:object="${booking}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: globalErrors}"></div>
        <input type="hidden" th:field="*{idRoom}">

        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: input('startDate', 'Date d\'arrivée', 'date')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: input('endDate', 'Date de départ', 'date')}"></div>
        </div>
        <div th:if="${#fields.hasErrors('endDateAfterStartDate')}" class="text-danger small mb-3" th:errors="*{endDateAfterStartDate}"></div>

        <div th:replace="~{fragments/layout :: input('sinCustomer', 'NAS du client', 'text')}"></div>
        <p class="text-muted small">Client déjà enregistré ? Le NAS suffit. Sinon, remplissez aussi les champs ci-dessous.</p>

        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: input('firstname', 'Prénom', 'text')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: input('lastname', 'Nom', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: input('streetNumber', 'Numéro de rue', 'number')}"></div>
            <div class="col-md-8" th:insert="~{fragments/layout :: input('streetName', 'Nom de rue', 'text')}"></div>
            <div class="col-md-5" th:insert="~{fragments/layout :: input('city', 'Ville', 'text')}"></div>
            <div class="col-md-3" th:insert="~{fragments/layout :: input('postalCode', 'Code postal', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: country}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Réserver</button>
        <a th:href="@{/room/search}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
