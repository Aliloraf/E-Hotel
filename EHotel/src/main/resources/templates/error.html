<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 class="h3" th:text="${status != null ? 'Erreur ' + status : 'Erreur'}">Erreur</h1>
    <p class="lead" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}"></p>
    <p class="lead" th:if="${message == null or #strings.isEmpty(message)}"
       th:text="${status == 404 ? 'La page demandée n\'existe pas.' : 'Une erreur est survenue lors du traitement de la requête.'}"></p>
    <a th:href="@{/}" class="btn btn-primary">Retour à l'accueil</a>
</div>
</body>
</html>
