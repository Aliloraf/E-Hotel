<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Paiements')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h2">Paiements</h1>
    <p th:if="${#lists.isEmpty(payments)}" class="text-muted">Aucun paiement enregistré.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(payments)}">
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th scope="col">Client</th>
                    <th scope="col">Hôtel</th>
                    <th scope="col">N° chambre</th>
                    <th scope="col">Montant</th>
                    <th scope="col">Date du paiement</th>
                    <th scope="col">Méthode de paiement</th>
                    <th scope="col">Statut du paiement</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.rental.customer.firstname} + ' ' + ${payment.rental.customer.lastname}"></td>
                    <td th:text="${payment.rental.room.hotel.name}"></td>
                    <td th:text="${payment.rental.room.roomNumber}"></td>
                    <td th:text="${#numbers.formatDecimal(payment.amount, 1, 2)} + ' $'"></td>
                    <td th:text="${payment.paymentDate}"></td>
                    <td th:text="${payment.paymentMethod}"></td>
                    <td th:text="${payment.paymentStatus}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
