<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ajouter un hôtel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Ajouter un hôtel</h1>
    <form th:action="@{/hotel/add}" th:object="${hotel}" method="post" novalidate>
        <div class="row">
            <div class="col-md-8" th:insert="~{fragments/layout :: input('name', 'Nom', 'text')}"></div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="startNumber">Nombre d'étoiles</label>
                <select class="form-select" th:field="*{startNumber}" th:errorclass="is-invalid">
                    <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('startNumber')}" th:errors="*{startNumber}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="idHotelChain">Chaîne hôtelière</label>
                <select class="form-select" th:field="*{idHotelChain}" th:errorclass="is-invalid">
                    <option th:each="chain : ${hotelChains}" th:value="${chain.id}" th:text="${chain.name}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('idHotelChain')}" th:errors="*{idHotelChain}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="sinManager">Gérant</label>
                <select class="form-select" th:field="*{sinManager}">
                    <option value="">Aucun</option>
                    <option th:each="m : ${managers}" th:value="${m.sinEmployee}"
                            th:text="${m.firstname} + ' ' + ${m.lastname} + (${m.hotel != null} ? ' (' + ${m.hotel.name} + ')' : '')"></option>
                </select>
            </div>
            <div class="col-12" th:insert="~{fragments/layout :: input('email', 'Courriel', 'email')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: input('streetNumber', 'Numéro de rue', 'number')}"></div>
            <div class="col-md-8" th:insert="~{fragments/layout :: input('streetName', 'Nom de rue', 'text')}"></div>
            <div class="col-md-5" th:insert="~{fragments/layout :: input('city', 'Ville', 'text')}"></div>
            <div class="col-md-3" th:insert="~{fragments/layout :: input('postalCode', 'Code postal', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: country}"></div>
        </div>
        <p class="text-muted small">Le nombre de chambres est mis à jour automatiquement quand des chambres sont ajoutées ou supprimées.</p>
        <button type="submit" class="btn btn-primary">Ajouter</button>
        <a th:href="@{/hotel/hotels}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
