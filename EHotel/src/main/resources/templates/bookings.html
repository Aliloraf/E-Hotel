<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Réservations')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h2">Réservations</h1>
    <p th:if="${#lists.isEmpty(bookings)}" class="text-muted">Aucune réservation en cours.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(bookings)}">
        <table class="table table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th scope="col">N°</th>
                    <th scope="col">Client</th>
                    <th scope="col">Hôtel</th>
                    <th scope="col">N° chambre</th>
                    <th scope="col">Date d'arrivée</th>
                    <th scope="col">Date de départ</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.idBooking}"></td>
                    <td th:text="${booking.customer.firstname} + ' ' + ${booking.customer.lastname}"></td>
                    <td th:text="${booking.room.hotel.name}"></td>
                    <td th:text="${booking.room.roomNumber}"></td>
                    <td th:text="${booking.startDate}"></td>
                    <td th:text="${booking.endDate}"></td>
                    <td>
                        <form th:action="@{/booking/transform/{id}(id=${booking.idBooking})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Transformer en location</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
