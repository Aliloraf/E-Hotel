<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chambres')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h2">Liste des chambres</h1>
    <form th:action="@{/room/list}" method="get" class="row g-2 align-items-end mt-2">
        <div class="col-md-6">
            <label for="hotelId" class="form-label">Hôtel</label>
            <select id="hotelId" name="hotelId" class="form-select" onchange="this.form.submit()">
                <option th:each="hotel : ${hotels}" th:value="${hotel.idHotel}" th:text="${hotel.name}"
                        th:selected="${hotel.idHotel == selectedHotelId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Filtrer</button>
        </div>
        <div class="col-auto ms-auto">
            <a th:href="@{/room/add(hotelId=${selectedHotelId})}" class="btn btn-primary">Ajouter une chambre</a>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(rooms)}" class="text-muted mt-4">Aucune chambre pour cet hôtel.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(rooms)}">
        <table class="table table-striped align-middle mt-4">
            <thead>
                <tr>
                    <th>N° chambre</th>
                    <th>Capacité</th>
                    <th>Vue</th>
                    <th>Prix / nuit</th>
                    <th>Disponible</th>
                    <th>Extensible</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.roomNumber}"></td>
                    <td th:text="${room.capacity}"></td>
                    <td th:text="${room.view}"></td>
                    <td th:text="${#numbers.formatDecimal(room.price, 1, 2)} + ' $'"></td>
                    <td th:text="${room.availability} ? 'Oui' : 'Non'"></td>
                    <td th:text="${room.extensible} ? 'Oui' : 'Non'"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/room/update/{id}(id=${room.idRoom})}" class="btn btn-primary btn-sm">Modifier</a>
                        <form th:action="@{/room/delete/{id}(id=${room.idRoom})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer cette chambre ainsi que ses réservations et locations ?');">
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
