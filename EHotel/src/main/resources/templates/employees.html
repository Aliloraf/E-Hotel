<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employés')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h2">Liste des employés</h1>
        <a th:href="@{/manager/employee/add}" class="btn btn-primary">Ajouter un employé</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th scope="col">NAS</th>
                    <th scope="col">Prénom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Rôle</th>
                    <th scope="col">Hôtel</th>
                    <th scope="col">Ville</th>
                    <th scope="col">Code postal</th>
                    <th scope="col">Pays</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.sinEmployee}"></td>
                    <td th:text="${employee.firstname}"></td>
                    <td th:text="${employee.lastname}"></td>
                    <td th:text="${employee.role}"></td>
                    <td th:text="${employee.hotel != null ? employee.hotel.name : '-'}"></td>
                    <td th:text="${employee.city}"></td>
                    <td th:text="${employee.postalCode}"></td>
                    <td th:text="${employee.country}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/manager/employee/update/{sin}(sin=${employee.sinEmployee})}" class="btn btn-primary btn-sm">Modifier</a>
                        <form th:action="@{/manager/employee/delete/{sin}(sin=${employee.sinEmployee})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer cet employé ?');">
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
