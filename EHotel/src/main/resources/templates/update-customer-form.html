<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier un client')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 720px">
    <h1 class="h2">Modifier un client</h1>
    <form th:action="@{/employee/customer/update/{sin}(sin=*{sinCustomer})}" th:object="${customer}" method="post" novalidate>
        <input type="hidden" th:field="*{sinCustomer}">
        <p>NAS : <strong th:text="*{sinCustomer}"></strong></p>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: input('firstname', 'Prénom', 'text')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: input('lastname', 'Nom', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: input('streetNumber', 'Numéro de rue', 'number')}"></div>
            <div class="col-md-8" th:insert="~{fragments/layout :: input('streetName', 'Nom de rue', 'text')}"></div>
            <div class="col-md-5" th:insert="~{fragments/layout :: input('city', 'Ville', 'text')}"></div>
            <div class="col-md-3" th:insert="~{fragments/layout :: input('postalCode', 'Code postal', 'text')}"></div>
            <div class="col-md-4" th:insert="~{fragments/layout :: country}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/employee/customers}" class="btn btn-link">Annuler</a>
    </form>
</div>
</body>
</html>
