<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Locations')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h2">Locations</h1>
    <p th:if="${#lists.isEmpty(rentals)}" class="text-muted">Aucune location.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(rentals)}">
        <table class="table table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th scope="col">N°</th>
                    <th scope="col">Client</th>
                    <th scope="col">Hôtel</th>
                    <th scope="col">N° chambre</th>
                    <th scope="col">Date d'arrivée</th>
                    <th scope="col">Date de départ</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rental : ${rentals}">
                    <td th:text="${rental.idRental}"></td>
                    <td th:text="${rental.customer.firstname} + ' ' + ${rental.customer.lastname}"></td>
                    <td th:text="${rental.room.hotel.name}"></td>
                    <td th:text="${rental.room.roomNumber}"></td>
                    <td th:text="${rental.startDate}"></td>
                    <td th:text="${rental.endDate}"></td>
                    <td>
                        <a th:href="@{/payment/add/{id}(id=${rental.idRental})}" class="btn btn-primary btn-sm">Enregistrer un paiement</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
