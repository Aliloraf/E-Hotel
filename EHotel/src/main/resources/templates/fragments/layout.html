<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | E-Hotel'">E-Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">E-Hotel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/room/search}">Rechercher une chambre</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Employé</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/employee/customers}">Clients</a></li>
                        <li><a class="dropdown-item" th:href="@{/booking/bookings}">Réservations</a></li>
                        <li><a class="dropdown-item" th:href="@{/booking/rentals}">Locations</a></li>
                        <li><a class="dropdown-item" th:href="@{/payment/payments}">Paiements</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Gestion</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/manager/employees}">Employés</a></li>
                        <li><a class="dropdown-item" th:href="@{/hotel/hotels}">Hôtels</a></li>
                        <li><a class="dropdown-item" th:href="@{/room/list}">Chambres</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
</div>

<!-- Text/number/date input bound to a field of the enclosing th:object, with validation feedback -->
<div th:fragment="input(field, label, type)" class="mb-3">
    <label class="form-label" th:for="${field}" th:text="${label}"></label>
    <input th:type="${type}" step="any" class="form-control" th:field="*{__${field}__}" th:errorclass="is-invalid">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('__${field}__')}" th:errors="*{__${field}__}"></div>
</div>

<div th:fragment="country" class="mb-3">
    <label class="form-label" for="country">Pays</label>
    <select class="form-select" th:field="*{country}" th:errorclass="is-invalid">
        <option value="CA">Canada</option>
        <option value="US">États-Unis</option>
        <option value="MX">Mexique</option>
    </select>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></div>
</div>

<div th:fragment="globalErrors" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
</div>

</body>
</html>
