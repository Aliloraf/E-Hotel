spring.application.name=EHotel

# PostgreSQL connection. Override with environment variables; no credentials are stored here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_hotel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The database schema is owned by ../schema.sql (tables, triggers, views and seed data).
# Hibernate only checks that the entity mappings match it and never modifies it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Keep the session id out of URLs
server.servlet.session.tracking-modes=cookie
